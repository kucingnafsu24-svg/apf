<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- [EDIT] Judul tab browser dan deskripsi untuk Google -->
  <title>Fortnite - PSD/Clip File</title>
  <meta name="description" content="Download file PSD/Clip Fortnite gratis.">

  <!-- [JANGAN DIUBAH, KECUALI JALUR] Salin baris <link> CSS dari <head> index.html milikmu.
       Karena file ini ada di folder posts/, jalurnya harus diawali ../
       Contoh: href="../assets/css/bootstrap.min.css" -->
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/font-awesome.css">
  <link rel="stylesheet" href="../assets/css/templatemo-cyborg-gaming.css">

  <!-- [BOLEH DIEDIT] CSS khusus halaman post. Semua aturan diawali .post-page -->
  <style>
    .post-page { max-width: 820px; margin: 0 auto; padding: 40px 20px 80px; color: #fff; }
    .post-page .kembali { display: inline-block; margin-bottom: 20px; color: #ec6090; text-decoration: none; }
    .post-page .cover { width: 100%; max-height: 380px; object-fit: cover; border-radius: 16px; }
    .post-page h1 { font-size: 32px; margin: 20px 0 4px; color: #fff; }
    .post-page .subjudul { color: #ec6090; margin: 0 0 16px; }
    .post-page .meta { display: flex; flex-wrap: wrap; gap: 18px; list-style: none; padding: 0; margin: 0 0 16px; font-size: 14px; }
    .post-page .meta i { color: #ec6090; margin-right: 4px; }
    .post-page .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .post-page .tag { background: #33363a; color: #ec6090; font-size: 13px; padding: 4px 12px; border-radius: 999px; }
    .post-page .isi p { line-height: 1.7; color: #d6d9dc; }
    .post-page .info-file { width: 100%; border-collapse: collapse; margin: 24px 0; }
    .post-page .info-file td { padding: 10px 0; border-bottom: 1px solid #3a3d40; }
    .post-page .info-file td:first-child { color: #93a0a8; width: 40%; }
    .post-page .btn-unduh { display: inline-block; background: #ec6090; color: #fff; font-weight: 600; text-decoration: none; padding: 12px 24px; border-radius: 10px; }
    .post-page .btn-unduh:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  </style>
</head>
<body>

  <!-- [JANGAN DIUBAH] Preloader, dibutuhkan oleh JavaScript template (custom.js) -->
  <div id="js-preloader" class="js-preloader">
    <div class="preloader-inner">
      <span class="dot"></span>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <main class="post-page">

    <!-- [BOLEH DIEDIT] Teks link kembali. Jalur ../index.html jangan diubah kalau file ada di folder posts/ -->
    <a class="kembali" href="../index.html"><i class="fa fa-arrow-left"></i> Kembali ke beranda</a>

    <!-- [EDIT] Gambar utama. Ganti nama file gambarnya, pertahankan awalan ../ -->
    <img class="cover" src="../assets/images/popular-01.jpg" alt="Gambar Fortnite">

    <!-- [EDIT] Judul dan subjudul -->
    <h1>Fortnite</h1>
    <p class="subjudul">Sandbox</p>

    <!-- [EDIT] Angka rating, jumlah unduhan, dan tanggal. Ikon (<i>) jangan dihapus -->
    <ul class="meta">
      <li><i class="fa fa-star"></i> 4.8</li>
      <li><i class="fa fa-download"></i> 2.3M</li>
      <li><i class="fa fa-calendar"></i> 5 Oktober 2026</li>
    </ul>

    <!-- [EDIT] Tag. Tambah atau hapus <span class="tag"> sesuai kebutuhan -->
    <div class="tags">
      <span class="tag">PSD</span>
      <span class="tag">Clip</span>
    </div>

    <!-- [EDIT] Deskripsi. Tambah paragraf dengan <p>...</p> -->
    <div class="isi">
      <p>Tulis penjelasan file di sini: isi file, untuk apa dipakai, dan syarat penggunaannya.</p>
      <p>Paragraf kedua bila diperlukan.</p>
    </div>

    <!-- [EDIT] Isi tabel info file. Struktur <tr><td> jangan diubah -->
    <table class="info-file">
      <tr><td>Format</td><td>PSD, CLIP</td></tr>
      <tr><td>Ukuran</td><td>85 MB</td></tr>
      <tr><td>Versi</td><td>1.0</td></tr>
    </table>

    <!-- [EDIT] Link unduh.
         File di folder files/ : href="../files/namafile.zip" dan pertahankan atribut download
         Link luar (Drive, GitHub Releases): tempel linknya di href, hapus atribut download,
         tambahkan target="_blank" rel="noopener" -->
    <a class="btn-unduh" href="../files/fortnite.zip" download>Unduh file</a>

  </main>

  <!-- [JANGAN DIUBAH, KECUALI JALUR] Salin tag <script> dari bagian bawah index.html milikmu,
       lalu tambahkan awalan ../ pada src. Contoh: <script src="../assets/js/custom.js"></script> -->

</body>
</html>
