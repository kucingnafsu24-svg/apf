<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Fletro Pro v6.1</title>
<meta name="description" content="Fletro Pro — template blog yang ringan, bersih, dan responsif.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header><div class="wrap bar">
 <a class="logo" href="/">Fletro Pro <small>v6.1</small></a>
 <nav><a href="/">Beranda</a><a href="/?label=Features">Features</a><a href="/?label=Update">Update</a><a href="/?label=Fullpage">Fullpage</a><a href="/?label=Sponsored">Sponsored</a></nav>
 <div class="tools">
  <button id="theme" aria-label="Mode gelap"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <button id="sbtn" aria-label="Cari"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
 </div>
</div>
<div class="search" id="search"><div class="wrap"><input id="q" placeholder="Cari artikel…" aria-label="Cari"></div></div>
</header>
<div class="topics" id="topics"></div>
<main class="wrap layout" id="layout">
 <section>
  <div class="slider" id="slider" hidden>
   <div class="track" id="track"></div>
   <button class="arr prev" id="sprev" aria-label="Sebelumnya"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
   <button class="arr next" id="snext" aria-label="Berikutnya"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
   <div class="dots" id="dots"></div>
  </div>
  <div class="title"><h2 id="ttl">Latest Posts</h2><i></i>
   <button id="view" aria-label="Ganti tampilan"><span id="vl">List</span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg></button></div>
  <div class="posts" id="posts"><div class="empty">Memuat…</div></div>
 </section>
 <aside>
  <div class="w"><h4>Popular Posts</h4><div class="pop" id="pop"></div></div>
  <div class="w"><h4>Ikuti Kami</h4><div class="social">
   <a class="s-dc" href="https://discord.gg/GANTI-LINK" target="_blank" rel="noopener">Discord</a>
   <a class="s-wa" href="https://whatsapp.com/channel/0029VbD7kFgK5cDLmIhYHc2C" target="_blank" rel="noopener">WhatsApp</a>
   <a class="s-fb" href="https://www.facebook.com/profile.php?id=61578062415881" target="_blank" rel="noopener">Facebook</a>
  </div></div>
  <div class="w"><h4>Dukung Kami</h4><div class="donate">
   <!-- TEMPEL KODE EMBED TRAKTEER DI SINI (salin dari dashboard Trakteer) -->
   <a class="s-tk" href="https://trakteer.id/Ridhocuking/tip" target="_blank" rel="noopener">Traktir di Trakteer</a>
  </div></div>
 </aside>
</main>
<footer><div class="wrap"><span>© 2021 Fletro Pro. All rights reserved.</span><span>Dibuat untuk Vercel</span></div></footer>
<script src="/js/app.js"></script>
</body>
</html>
