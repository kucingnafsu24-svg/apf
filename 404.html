<!DOCTYPE html>

<head>
<meta charset="utf-8">

.nf{max-width:520px;margin:96px auto;padding:0 24px;text-align:center}
.nf .code{margin:0;font-size:96px;line-height:1;font-weight:700;color:var(--link)}

.nf p{margin:0 0 26px;color:var(--alt);font-size:14px;line-height:1.6}
.nf .acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.nf .go,.nf .ghost{display:inline-flex;justify-content:center;padding:11px 20px;border-radius:8px;font-size:14px;font-weight:600}
.nf .go{background:var(--link);color:#fff}
.nf .go:hover{filter:brightness(1.1);background:var(--link)}
.nf .ghost{border:1px solid var(--line);color:var(--head)}
.nf .ghost:hover{background:var(--card)}
@media(max-width:480px){.nf{margin:64px auto}.nf .code{font-size:72px}}

<script src="/js/fade.js"></script>

<body>
<header><div class="wrap bar">

<script>
(function(){
 var r=document.documentElement;
 try{var t=localStorage.getItem('theme');if(t)r.setAttribute('data-theme',t)}catch(e){}
 var b=document.getElementById('theme');
 if(b)b.onclick=function(){
  var d=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);
  var n=d?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('theme',n)}catch(e){}
 };
})();
</script>
