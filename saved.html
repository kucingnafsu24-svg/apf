<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tersimpan &amp; Favorit — All Pirate File</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.svp{max-width:860px;margin:0 auto;padding-top:20px;padding-bottom:40px}
.svp [hidden]{display:none!important}
.svp .rm{margin-top:10px;padding:6px 14px;border:1px solid var(--line);border-radius:18px;font-size:13px;color:var(--alt);cursor:pointer;background:none}
.svp .rm:hover{background:var(--card);color:var(--head)}
.svp .gone h3{color:var(--alt)}
.svtabs{display:flex;gap:8px;margin:14px 0 18px}
.svtabs button{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid var(--line);border-radius:20px;font-size:14px;font-weight:600;color:var(--body);cursor:pointer;background:none}
.svtabs button:hover{background:var(--card)}
.svtabs button.on{background:var(--head);border-color:var(--head);color:var(--bg)}
.svtabs b{font-weight:600;font-size:12.5px;opacity:.75}
.fv-list{display:grid;gap:10px}
.fv-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.fv-item a{flex:1;min-width:0;font-weight:600;color:var(--head);overflow-wrap:anywhere}
.fv-item a:hover{color:var(--link)}
.fv-item .rm{margin:0;flex:none}
.svnote{margin:28px 0 0;font-size:12.5px;color:var(--alt)}
</style>
<script src="/js/fade.js"></script>
</head>
<body>
<header><div class="wrap bar">
 <a class="logo" href="/" aria-label="All Pirate File"><img src="/images/logo/apf-logo.svg" alt="All Pirate File" onerror="this.replaceWith(document.createTextNode('All Pirate File'))"></a>
 <div class="tools">
 </div>
</div></header>

<main class="wrap svp">
 <div class="title"><h2>Tersimpan &amp; Favorit</h2><i></i></div>
 <div class="svtabs" role="tablist">
  <button type="button" id="tab-post" role="tab" class="on">Postingan <b id="n-post">0</b></button>
  <button type="button" id="tab-artist" role="tab">Artist <b id="n-artist">0</b></button>
 </div>
 <div class="posts" id="saved"><div class="empty">Memuat…</div></div>
 <div class="fv-list" id="favs" hidden></div>
 <p class="svnote">Tanpa login, daftar ini tersimpan di browser perangkat ini (hilang jika data browser dihapus). Jika kamu login, daftar juga tersimpan di akunmu dan ikut ke perangkat lain.</p>
</main>

<footer><div class="wrap"><span>© 2021 Fletro Pro. All rights reserved.</span><span>All Pirate File</span></div></footer>
<script src="/js/config.js"></script>
<script src="/js/favorites.js"></script>
<script src="/js/favorites-sync.js"></script>
<script src="/js/lib.js"></script>
<script src="/js/auth.js"></script>
<script>
(function(){
var S=window.APF_SAVED,box=document.getElementById('saved'),fav=document.getElementById('favs');
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var fmt=function(d){var x=new Date(String(d).slice(0,10)+'T00:00:00');return isNaN(x)?'':x.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'})};
var say=function(h){box.innerHTML='<div class="empty">'+h+'</div>'};
var slugOf=function(p){return String(p.slug||String(p.title||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')).toLowerCase()};
var map={},loaded=false;

if(!S||!S.ok){say('Browser ini memblokir penyimpanan (mungkin mode privat), jadi daftar tidak bisa dipakai.<br><a class="more" href="/">Ke beranda</a>');$('n-post').textContent='0';return}

function thumb(p,href){
 if(p.image)return '<a href="'+href+'" class="thumb"><img src="'+esc(p.image)+'" alt="" loading="lazy"></a>';
 var t=p.thumb||{};
 return '<a href="'+href+'" class="thumb '+esc(t.cls||'t1')+'"><span><strong>'+esc(t.title||String(p.title||'').slice(0,14))+'</strong><small>'+esc(t.sub||'')+'</small></span></a>';
}
function card(row,p){
 var s=row.k,href=(p&&p._comic?'/k/':'/g/')+encodeURIComponent(s);
 if(!p)return '<article class="post gone" data-s="'+esc(s)+'"><div><h3>Postingan tidak tersedia</h3><p style="display:block">'+esc(s)+'</p><button type="button" class="rm">Hapus dari daftar</button></div><span></span></article>';
 return '<article class="post" data-s="'+esc(s)+'"><div><div class="meta"><span>'+fmt(p.date)+'</span></div>'+
  '<h3><a href="'+href+'">'+esc(p.title)+'</a></h3>'+(p.excerpt?'<p>'+esc(p.excerpt)+'</p>':'')+
  '<button type="button" class="rm">Hapus dari simpanan</button></div>'+thumb(p,href)+'</article>';
}
function drawPosts(){
 var rows=S.posts();$('n-post').textContent=rows.length;
 if(!loaded)return;
 if(!rows.length){say('Belum ada postingan yang disimpan. Tekan tombol <b>Simpan</b> di halaman artikel.<br><a class="more" href="/">Ke beranda</a>');return}
 box.innerHTML=rows.map(function(r){return card(r,map[r.k])}).join('');
}
function drawArtists(){
 var rows=S.artists();$('n-artist').textContent=rows.length;
 if(!rows.length){fav.innerHTML='<div class="empty">Belum ada artist favorit. Buka halaman artist lalu tekan tombol <b>Favorit</b>.<br><a class="more" href="/">Ke beranda</a></div>';return}
 fav.innerHTML=rows.map(function(r){
  return '<div class="fv-item" data-k="'+esc(r.k)+'"><a href="/artist/'+encodeURIComponent(r.n||r.k)+'">'+esc(r.n||r.k)+'</a><button type="button" class="rm">Hapus</button></div>'}).join('');
}
function show(w){
 $('tab-post').classList.toggle('on',w==='post');$('tab-artist').classList.toggle('on',w==='artist');
 box.hidden=w!=='post';fav.hidden=w!=='artist';
 try{history.replaceState(null,'',w==='artist'?'#artist':location.pathname+location.search)}catch(e){}
}
$('tab-post').onclick=function(){show('post')};$('tab-artist').onclick=function(){show('artist')};
box.onclick=function(e){var b=e.target.closest&&e.target.closest('.rm');if(!b)return;var a=b.closest('.post');if(!a)return;S.delPost(a.getAttribute('data-s'));drawPosts()};
fav.onclick=function(e){var b=e.target.closest&&e.target.closest('.rm');if(!b)return;var a=b.closest('.fv-item');if(!a)return;S.delArtist(a.getAttribute('data-k'));drawArtists()};
window.addEventListener('storage',function(){drawPosts();drawArtists()});

drawArtists();show(location.hash==='#artist'?'artist':'post');
$('n-post').textContent=S.posts().length;
/* post biasa (data/posts.json) dan komik (data/comic.json) dimuat terpisah; komik ditandai _comic supaya linknya ke /k/slug */
var getJ=function(u){return fetch(u).then(function(x){return x.json()}).then(function(d){return Array.isArray(d)?d:(d&&d.posts)||[]})};
Promise.all([getJ('/data/posts.json').then(function(a){return {ok:1,a:a}},function(){return {ok:0,a:[]}}),
 getJ('/data/comic.json').then(function(a){return {ok:1,a:a}},function(){return {ok:0,a:[]}})]).then(function(r){
 if(!r[0].ok&&!r[1].ok){say('Gagal memuat data postingan. Coba lagi nanti.');return}
 r[1].a.forEach(function(p){if(p&&typeof p==='object'){p._comic=true;map[slugOf(p)]=p}});
 r[0].a.forEach(function(p){if(p&&typeof p==='object')map[slugOf(p)]=p});
 loaded=true;drawPosts();
});
})();
</script>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
